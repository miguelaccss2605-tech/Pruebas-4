<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grupo 8 - Crédito Hipotecario</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <p><a href="index.html">← Volver al menú</a></p>
  <h1>GRUPO 8: Evaluador de Solicitud de Crédito Hipotecario</h1>

  <div class="card">
    <div class="fila">
      <div><label for="sueldo">Sueldo mensual ($)</label><input id="sueldo" type="number" min="0" value="2500"></div>
      <div><label for="edad">Edad</label><input id="edad" type="number" min="0" value="35"></div>
      <div>
        <label for="historial">Historial crediticio</label>
        <select id="historial">
          <option>Excelente</option>
          <option selected>Bueno</option>
          <option>Malo</option>
        </select>
      </div>
    </div>
    <div class="fila">
      <div><label for="monto">Monto del préstamo ($)</label><input id="monto" type="number" min="0" value="60000"></div>
      <div><label for="plazo">Plazo (meses)</label><input id="plazo" type="number" min="1" value="120"></div>
    </div>
    <button id="evaluar">Evaluar solicitud</button>
    <div id="salida" class="resultado"></div>
  </div>

  <div class="card">
    <h2>Pruebas (caja blanca y caja negra)</h2>
    <button id="probar">Ejecutar pruebas</button>
    <div id="pruebas"></div>
  </div>
</main>
<script src="util.js"></script>
<script src="grupo8.js"></script>
</body>
</html>
